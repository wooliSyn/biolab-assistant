# 打包发布：只手动触发（Actions 页 → 「打包发布」→ Run workflow）。
# 不挂 push / tag，避免每次推代码都白跑十几分钟。
#
# 版本号取自 package.json（唯一来源，见 sync-version.mjs）；
# 发版前先 `npm run version:set x.y.z` 并提交，再来这里点运行。
#
# 产物：
#   macOS   通用二进制（Apple Silicon + Intel）.dmg / .app
#   Windows .msi（WiX，中文界面）+ .exe（NSIS）
# 选「创建 Release 草稿」时，产物直接挂到 vX.Y.Z 的 Release 草稿上，检查无误后在网页上点 Publish；
# 不选则只作为构建产物（Artifacts）保留 7 天，可在本次运行页面下载。
#
# 注意：macOS 包未签名、未公证，用户首次打开需右键 →「打开」放行。
name: 打包发布

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 打包哪个平台
        type: choice
        options: [全部, macOS, Windows]
        default: 全部
      release:
        description: 创建 Release 草稿（不勾选则只上传构建产物）
        type: boolean
        default: true

# 同一分支上重复点运行时，取消还在跑的旧任务
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release / 上传附件需要

jobs:
  build:
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          inputs.platform == 'macOS' && '[{"name":"macOS","os":"macos-latest","args":"--target universal-apple-darwin","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]' ||
          inputs.platform == 'Windows' && '[{"name":"Windows","os":"windows-latest","args":"","rust_targets":""}]' ||
          '[{"name":"macOS","os":"macos-latest","args":"--target universal-apple-darwin","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"name":"Windows","os":"windows-latest","args":"","rust_targets":""}]'
          ) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 缓存 Rust 依赖编译结果：第二次起能省掉大半编译时间
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # node_modules 里的 esbuild / rollup / tauri-cli 是平台门控二进制，必须在各自 runner 上装
      - run: npm ci

      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # tauri-action 会执行 tauri.conf.json 的 beforeBuildCommand（npm run build，含版本号一致性校验）
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ inputs.release && format('v{0}', steps.ver.outputs.version) || '' }}
          releaseName: ${{ inputs.release && format('BioLab v{0}', steps.ver.outputs.version) || '' }}
          releaseBody: |
            ## 下载
            - **macOS**（Apple Silicon / Intel 通用）：`.dmg`
              首次打开如提示「无法验证开发者」，请右键 App →「打开」。
            - **Windows**：`.msi` 或 `-setup.exe` 任选其一

            所有数据保存在本机，不联网、无账号。
          releaseDraft: true
          prerelease: false

      - name: 上传构建产物
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: BioLab-${{ steps.ver.outputs.version }}-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
