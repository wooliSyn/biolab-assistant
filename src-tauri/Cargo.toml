[package]
name = "biolab-assistant"
version = "1.14.0"
description = "BioLab 实验助手 - RNA实验协作工具"
authors = ["YunPlover"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
